name: Build AI Transcript TXT
on:
  push:
    branches:
      - exports/ai-transcripts-2026-10-21
    paths-ignore:
      - JIANG_XUEQIN_ALL_TRANSCRIPTS_2026-10-21.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transcript retrieval dependencies
        run: python -m pip install -q beautifulsoup4 yt-dlp
      - name: Compile single searchable TXT
        run: |
          sed -i 's/parents\[1\]/parents[2]/' ops/scripts/build_all_transcripts_txt.py
          python ops/scripts/build_all_transcripts_txt.py
          test -s JIANG_XUEQIN_ALL_TRANSCRIPTS_2026-10-21.txt
      - name: Preserve one-file download in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: jiang-one-complete-transcripts-txt
          path: JIANG_XUEQIN_ALL_TRANSCRIPTS_2026-10-21.txt
          retention-days: 30
      - name: Commit the finished TXT on the export branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JIANG_XUEQIN_ALL_TRANSCRIPTS_2026-10-21.txt
          git diff --cached --quiet || (git commit -m "Export all retrieved Jiang transcripts as one searchable TXT" && git push origin HEAD:exports/ai-transcripts-2026-10-21)
