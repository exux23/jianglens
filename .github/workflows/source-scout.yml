name: Source Scout

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      max_ingest:
        description: "Maximum newly discovered Predictive History videos to bootstrap this run"
        required: false
        default: "2"
        type: string
      retry_needs_transcript:
        description: "Retry sources that previously had no usable English captions"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: source-scout
  cancel-in-progress: false

jobs:
  discover-and-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Configure optional YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${YOUTUBE_COOKIES_B64:-}" ]; then
            cookie_file="${RUNNER_TEMP}/youtube-cookies.txt"
            printf '%s' "${YOUTUBE_COOKIES_B64}" | base64 --decode > "${cookie_file}"
            chmod 600 "${cookie_file}"
            echo "JIANGLENS_YOUTUBE_COOKIES_FILE=${cookie_file}" >> "${GITHUB_ENV}"
          fi

      - name: Discover Predictive History uploads
        run: |
          node ops/scripts/source-scout.mjs \
            --channel-url https://www.youtube.com/@PredictiveHistory/videos \
            --channel-path @PredictiveHistory \
            --limit 100 \
            --stale-hours 24

      - name: Bootstrap newly discovered sources from YouTube captions
        env:
          MAX_INGEST: ${{ inputs.max_ingest }}
          RETRY_NEEDS_TRANSCRIPT: ${{ inputs.retry_needs_transcript }}
        run: |
          set -euo pipefail
          max_ingest="${MAX_INGEST:-2}"
          args=(--max "${max_ingest}" --channel-path @PredictiveHistory)
          if [ "${RETRY_NEEDS_TRANSCRIPT:-false}" = "true" ]; then
            args+=(--retry-needs-transcript)
          fi
          node ops/scripts/bootstrap-youtube-source.mjs "${args[@]}"

      - name: Validate canonical content
        run: |
          node ops/scripts/compile-content.mjs
          node ops/scripts/validate-content.mjs

      - name: Commit source state when it changed
        run: |
          set -euo pipefail
          changes="$(git status --porcelain --untracked-files=normal -- \
            content/sources/raw/youtube \
            content/sources/videos \
            content/workflow/tasks)"
          if [ -z "${changes}" ]; then
            echo "No new source state to commit."
            exit 0
          fi

          printf '%s\n' "${changes}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/sources/raw/youtube content/sources/videos content/workflow/tasks
          git commit -m "Scout and bootstrap Predictive History sources"
          git pull --rebase origin main
          git push origin HEAD:main
